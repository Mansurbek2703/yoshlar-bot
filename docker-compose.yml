services:
  postgres:
    image: postgres:15-alpine
    container_name: youth_bot_postgres
    restart: always
    environment:
      POSTGRES_DB: youth_bot
      POSTGRES_USER: youth_user
      POSTGRES_PASSWORD: youth_secure_password
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U youth_user -d youth_bot"]
      interval: 5s
      timeout: 5s
      retries: 5

  bot:
    build: .
    container_name: youth_bot_app
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - .env
    environment:
      - DATABASE_URL=postgresql+asyncpg://youth_user:youth_secure_password@postgres:5432/youth_bot
      - WEB_SERVER_HOST=0.0.0.0
      - WEB_SERVER_PORT=8000
    ports:
      - "8000:8000"
    volumes:
      - ./logs:/app/logs
      - ./backups:/app/backups

volumes:
  pgdata:
